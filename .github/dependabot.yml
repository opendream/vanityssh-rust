version: 2
updates:
  # Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Bangkok"
    
    # PR management
    open-pull-requests-limit: 5
    target-branch: "main"
    
    # Note: Auto-merge is handled by our custom workflow
    # No need for enable-beta-ecosystems (not supported in cargo ecosystem)
    
    # Group related dependencies to reduce PR noise
    groups:
      # Cryptography and security-critical dependencies
      crypto:
        patterns:
          - "ed25519-*"
          - "rand*"
          - "sha*"
          - "curve25519-*"
          - "digest*"
          - "crypto-*"
        update-types:
          - "minor"
          - "patch"
      
      # Development and testing tools
      dev-tools:
        patterns:
          - "assert_cmd"
          - "predicates"
          - "tempfile"
          - "criterion*"
        update-types:
          - "minor" 
          - "patch"
      
      # Build and utility dependencies
      utilities:
        patterns:
          - "anyhow"
          - "thiserror"
          - "indicatif"
          - "chrono"
          - "base64"
          - "hex"
          - "regex*"
        update-types:
          - "minor"
          - "patch"
      
      # Threading and performance
      threading:
        patterns:
          - "crossbeam*"
          - "num_cpus"
          - "rayon*"
        update-types:
          - "minor"
          - "patch"
    
    # Commit message preferences
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
      include: "scope"
    
    # Security updates get higher priority
    labels:
      - "dependencies"
      - "security"
    
    # Note: ignore, reviewers, and assignees can be added later when needed
    # Empty arrays cause schema validation errors, so they're omitted